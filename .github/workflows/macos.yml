---
# See https://github.com/actions/virtual-environments

name: Test Code on OS/X
permissions:
  contents: read
on:
  push:
    branches:
      - "*"
    tags-ignore:
      - "*"
  pull_request:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-13
          - macos-latest
        perl: ["5.38", "5.36", "5.34", "5.32", "5.30", "5.28", "5.22"]
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: codecov/codecov-action@v7
      - name: Setup perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - run: perl -V
      - name: Install Dependencies
        run: |
          # export PATH=$PATH:/opt/homebrew/Cellar/perl/5.40.2/bin
          # Don't pin the perl version: brew's perl moves on (5.40 -> 5.44)
          PERL_BIN="$(brew --prefix perl)/bin"
          echo "$PERL_BIN" >> "$GITHUB_PATH"
          export PATH="$PERL_BIN:$PATH"
          cpan -iT File::Spec ExtUtils::MakeMaker App::cpanminus

          cpanm -iqn --skip-satisfied File::Spec ExtUtils::MakeMaker Devel::Cover::Report::Codecov Test::Harness
          cpanm -iqn --skip-satisfied Test::Script Test::Portability::Files Test::Carp Test::Compile Test::Pod::Coverage LWP::UserAgent
          cpanm -iqn --skip-satisfied --installdeps --notest .
        # run: |
        # cover -test
        # cover -report codecov
        # curl -Os https://uploader.codecov.io/latest/macos/codecov
        # chmod +x codecov
        # ./codecov -t ${{ secrets.CODECOV_TOKEN }}
        # shell: bash
        # env:
        # AUTHOR_TESTING: 1
        # CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # - name: Run Tests
      - name: Run Tests
        run: prove -l -b t
        shell: bash
        env:
          AUTHOR_TESTING: 1
          AUTOMATED_TESTING: 1
