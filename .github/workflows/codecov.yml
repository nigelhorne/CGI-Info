---
# https://github.com/codecov/example-perl/blob/master/github.yml
name: Code coverage - codecov.io
permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - "*"
    tags-ignore:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    name: codecov
    container:
      image: perl:stable
    steps:
      - uses: actions/checkout@v7
      - name: Install Dependencies
        run: |
          cpanm --quiet --notest --installdeps .
          cpanm --quiet --notest Module::Build Devel::Cover Devel::Cover::Report::Codecov
      - name: Build module
        run: |
          perl Makefile.PL
          make
        env:
          AUTHOR_TESTING: 1
          AUTOMATED_TESTING: 1
      - name: Submit codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          AUTOMATED_TESTING: 1
        run: |
          CODECOV_TOKEN=${{ secrets.CODECOV_TOKEN }} cover -test
          CODECOV_TOKEN=${{ secrets.CODECOV_TOKEN }} cover -report codecov
